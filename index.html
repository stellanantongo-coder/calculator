<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
    
    <div class="display">0</div>
    
    <div class="buttons">

        <button class="function1">AC</button>
        <button class="function2">00</button>

        <button class="function3">%</button>
        <button class="operator">÷</button>

        <button class=" normalkey">7</button>
        <button class=" normalkey">8</button>
        <button class=" normalkey">9</button>
        <button class="operator">×</button>

        <button class="normalkey">4</button>
        <button class="normalkey">5</button>
        <button class="normalkey">6</button>
        <button class="operator">-</button>

        <button class="normalkey">1</button>
        <button class="normalkey">2</button>
        <button class="normalkey">3</button>
       
        <button class="operator">+</button>

        <button class="zero">0</button>
        <button class="normalkey">.</button>
        <button class="operator">=</button>

    </div>
    </main>
    
    
</body>
</html>
